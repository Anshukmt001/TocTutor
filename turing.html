<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turing Lab | TOC Academy</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="ph-fill ph-graph"></i>
                <h2>TOC<span>Tutor</span></h2>
            </div>
            
            <nav class="nav-menu">
                <a href="index.html" class="nav-item">
                    <i class="ph ph-squares-four"></i>
                    <span>Dashboard</span>
                </a>
                <a href="turing.html" class="nav-item active">
                    <i class="ph ph-cpu"></i>
                    <span>Turing Lab</span>
                </a>
                <a href="converter.html" class="nav-item">
                    <i class="ph ph-intersect"></i>
                    <span>Converter</span>
                </a>
                <a href="library.html" class="nav-item">
                    <i class="ph ph-books"></i>
                    <span>Library</span>
                </a>
                <a href="exam.html" class="nav-item">
                    <i class="ph ph-exam"></i>
                    <span>Exam Center</span>
                </a>
            </nav>
            
            <div class="user-profile">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User Avatar" class="avatar">
                <div class="user-info">
                    <span class="user-name" id="display-name">User</span>
                    <span class="user-role">Student</span>
                </div>
                <button id="btn-logout" class="icon-btn logout-btn"><i class="ph ph-sign-out"></i></button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="welcome-text">
                    <h1>Turing Lab</h1>
                    <p>Design and simulate your automata.</p>
                </div>
            </header>

            <!-- Reverting to classic toolbar layout -->
            <div class="simulator-controls glass-card" style="display: flex; gap: 0.8rem; margin-bottom: 1.5rem; padding: 1rem; flex-wrap: wrap; align-items: center;">
                <button id="btn-add-state" class="glass-btn"><i class="ph ph-plus-circle"></i> State</button>
                <button id="btn-add-transition" class="glass-btn"><i class="ph ph-arrow-square-out"></i> Link</button>
                <button id="btn-set-start" class="glass-btn"><i class="ph ph-flag"></i> Start</button>
                <button id="btn-set-accept" class="glass-btn"><i class="ph ph-check-circle"></i> Accept</button>
                <button id="btn-random-dfa" class="glass-btn" style="background: rgba(160, 170, 178, 0.1);"><i class="ph ph-shuffle"></i> Random</button>
                <button id="btn-clear" class="glass-btn" style="color: #ff4c4c;"><i class="ph ph-trash"></i> Clear</button>
                <div style="flex: 1;"></div>
                <input type="text" id="sim-string" class="glass-input" placeholder="Input string..." style="max-width: 180px;">
                <button id="btn-simulate" class="glass-btn highlight-btn"><i class="ph ph-play"></i> Run</button>
            </div>

            <div class="canvas-container glass-card" style="flex: 1; height: 60vh; position: relative; padding: 0; overflow: hidden; background: #0f111a;">
                <canvas id="dfa-canvas" style="width: 100%; height: 100%; display: block;"></canvas>
                <div style="position: absolute; bottom: 1rem; right: 1rem; color: var(--text-secondary); font-size: 0.8rem; background: rgba(0,0,0,0.5); padding: 0.5rem 1rem; border-radius: 20px;">
                    Click to add • Drag to link
                </div>
            </div>
        </main>
    </div>

    <!-- Transition Symbol Modal -->
    <div id="transition-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-card" style="max-width: 400px; text-align: center; padding: 2rem;">
            <h3 style="margin-bottom: 1rem;">Add Transition</h3>
            <p id="transition-info" style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1.5rem;">q0 → q1</p>
            <input type="text" id="transition-symbol-input" class="glass-input" placeholder="e.g. 0,1" style="width: 100%; text-align: center; font-size: 1.2rem; margin-bottom: 1.5rem;">
            <div style="display: flex; gap: 1rem;">
                <button id="btn-confirm-transition" class="glass-btn highlight-btn" style="flex: 1;">Confirm</button>
                <button id="btn-cancel-transition" class="glass-btn" style="flex: 1;">Cancel</button>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="js/lab.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof initLab === 'function') initLab();
        });
    </script>
</body>
</html>
