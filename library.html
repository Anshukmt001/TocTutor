<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library | TOC Academy</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="ph-fill ph-graph"></i>
                <h2>TOC<span>Tutor</span></h2>
            </div>
            
            <nav class="nav-menu">
                <a href="index.html" class="nav-item">
                    <i class="ph ph-squares-four"></i>
                    <span>Dashboard</span>
                </a>
                <a href="turing.html" class="nav-item">
                    <i class="ph ph-cpu"></i>
                    <span>Turing Lab</span>
                </a>
                <a href="converter.html" class="nav-item">
                    <i class="ph ph-intersect"></i>
                    <span>Converter</span>
                </a>
                <a href="library.html" class="nav-item active">
                    <i class="ph ph-books"></i>
                    <span>Library</span>
                </a>
                <a href="exam.html" class="nav-item">
                    <i class="ph ph-exam"></i>
                    <span>Exam Center</span>
                </a>
            </nav>
            
            <div class="user-profile">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User Avatar" class="avatar">
                <div class="user-info">
                    <span class="user-name" id="display-name">User</span>
                    <span class="user-role">Student</span>
                </div>
                <button id="btn-logout" class="icon-btn logout-btn"><i class="ph ph-sign-out"></i></button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="welcome-text">
                    <h1>TOC Library</h1>
                    <p>Master the theory with our curated guides and AI expert.</p>
                </div>
            </header>

            <div id="library-view">
                <div id="library-cards-container" class="library-grid">
                    <!-- Cards will be populated by JS -->
                </div>
            </div>

            <div id="topic-detail-view" style="display: none;">
                <button id="btn-back-to-library" class="glass-btn" style="margin-bottom: 1.5rem;">
                    <i class="ph ph-arrow-left"></i> Back to Library
                </button>
                <div id="topic-detail-content" class="glass-card topic-detail-card">
                    <!-- Detail populated by JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- AI Chatbot remains persistent if needed, but for now we'll keep it simple -->
    
    <script src="shared.js"></script>
    <script src="js/library.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof initLibrary === 'function') initLibrary();
        });
    </script>
</body>
</html>
